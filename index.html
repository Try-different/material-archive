<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>素材归档站 · 观察与思考</title>
<style>
:root {
  --bg: #0d1117;
  --header-bg: rgba(13,17,23,0.85);
  --card-bg: #161b22;
  --card-hover-border: #58a6ff;
  --border: #30363d;
  --text: #e6edf3;
  --text-secondary: #8b949e;
  --accent: #58a6ff;
  --accent-glow: rgba(88, 166, 255, 0.15);
  --tag-bg: #1f6feb26;
  --tag-text: #58a6ff;
  --tag-active-bg: #1f6feb;
  --tag-active-text: #ffffff;
  --quote-bg: rgba(88,166,255,0.06);
  --section-bg: rgba(255,255,255,0.03);
  --gradient-start: #58a6ff;
  --gradient-end: #bc8cff;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);

  --stance-agree: #238636;
  --stance-oppose: #da3633;
  --stance-watch: #d29922;
  --stance-fun: #a371f7;
  --stance-default: #58a6ff;
}

[data-theme="light"] {
  --bg: #f6f8fa;
  --header-bg: rgba(246,248,250,0.88);
  --card-bg: #ffffff;
  --card-hover-border: #0969da;
  --border: #d0d7de;
  --text: #1f2328;
  --text-secondary: #656d76;
  --accent: #0969da;
  --accent-glow: rgba(9, 105, 218, 0.12);
  --tag-bg: #ddf4ff;
  --tag-text: #0969da;
  --tag-active-bg: #0969da;
  --tag-active-text: #ffffff;
  --quote-bg: #f6f8fa;
  --section-bg: #f8fafc;
  --gradient-start: #0969da;
  --gradient-end: #8250df;
  --shadow: 0 4px 20px rgba(140,149,159,0.15);

  --stance-agree: #1a7f37;
  --stance-oppose: #cf222e;
  --stance-watch: #9a6700;
  --stance-fun: #8250df;
  --stance-default: #0969da;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  transition: background-color 0.25s, color 0.25s;
}

header {
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  background: var(--header-bg);
  border-bottom: 1px solid var(--border);
  padding: 14px 0;
}
.header-inner {
  max-width: 860px; margin: 0 auto; padding: 0 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.site-title {
  font-size: 20px; font-weight: 700;
  display: flex; align-items: center; gap: 8px;
  background: linear-gradient(135deg, var(--gradient-start), var(--gradient-end));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  cursor: pointer; user-select: none;
}
.header-actions { display: flex; align-items: center; gap: 12px; }
.theme-btn {
  background: var(--card-bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  transition: all 0.2s;
}
.theme-btn:hover { border-color: var(--accent); }

.container { max-width: 860px; margin: 0 auto; padding: 24px 20px 80px; }

/* Dashboard banner */
.dashboard {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.metric-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  box-shadow: var(--shadow);
}
.metric-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
.metric-value { font-size: 22px; font-weight: 700; color: var(--accent); }

/* Controls */
.controls-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px 18px;
  margin-bottom: 24px;
  box-shadow: var(--shadow);
}
.search-wrapper { position: relative; margin-bottom: 12px; }
.search-box {
  width: 100%; padding: 10px 14px 10px 38px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.search-box:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-glow);
}
.search-box::placeholder { color: var(--text-secondary); }
.search-icon {
  position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
  color: var(--text-secondary); font-size: 14px; pointer-events: none;
}
.tag-list { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag-pill {
  font-size: 12px; padding: 4px 12px; border-radius: 16px;
  background: var(--tag-bg); color: var(--tag-text);
  border: 1px solid transparent;
  cursor: pointer; user-select: none;
  transition: all 0.2s;
}
.tag-pill:hover { border-color: var(--accent); }
.tag-pill.active {
  background: var(--tag-active-bg);
  color: var(--tag-active-text);
  font-weight: 600;
}

/* List View Grid */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
  gap: 20px;
}
.card-item {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  box-shadow: var(--shadow);
  cursor: pointer;
  display: flex; flex-direction: column;
  transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.card-item:hover {
  transform: translateY(-3px);
  border-color: var(--card-hover-border);
  box-shadow: 0 8px 24px rgba(0,0,0,0.18);
}
.card-thumb-wrap {
  width: 100%; height: 180px; background: var(--border);
  position: relative; overflow: hidden;
}
.card-thumb {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.3s;
}
.card-item:hover .card-thumb { transform: scale(1.03); }
.card-body {
  padding: 18px 20px; flex: 1; display: flex; flex-direction: column;
}
.card-header-meta {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 10px; gap: 8px;
}
.stance-badge {
  font-size: 11px; font-weight: 600;
  padding: 2px 8px; border-radius: 6px;
  color: #ffffff; display: inline-flex; align-items: center; gap: 4px;
}
.stance-agree { background: var(--stance-agree); }
.stance-oppose { background: var(--stance-oppose); }
.stance-watch { background: var(--stance-watch); }
.stance-fun { background: var(--stance-fun); }
.stance-default { background: var(--stance-default); }

.card-time { font-size: 12px; color: var(--text-secondary); }
.card-title {
  font-size: 17px; font-weight: 700; line-height: 1.45;
  color: var(--text); margin-bottom: 10px;
}
.card-snippet {
  font-size: 13.5px; color: var(--text-secondary);
  line-height: 1.6; margin-bottom: 14px; flex: 1;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 12px; border-top: 1px solid var(--border);
  font-size: 12px; color: var(--accent);
}
.card-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.card-tag {
  background: var(--tag-bg); color: var(--tag-text);
  padding: 2px 8px; border-radius: 10px; font-size: 11px;
}
.read-more-hint {
  font-weight: 600; display: inline-flex; align-items: center; gap: 4px;
}

/* Detail View Viewport */
.detail-view {
  display: none;
  animation: fadeIn 0.25s ease-out;
}
.detail-view.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.back-bar {
  margin-bottom: 20px;
}
.back-btn {
  background: var(--card-bg);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 8px 16px;
  font-size: 13.5px; font-weight: 600;
  cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  transition: all 0.2s;
}
.back-btn:hover { border-color: var(--accent); color: var(--accent); }

.article-card {
  background: var(--card-bg);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px;
  box-shadow: var(--shadow);
}
.article-header {
  margin-bottom: 24px; padding-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.article-meta {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px; flex-wrap: wrap;
}
.article-title {
  font-size: 26px; font-weight: 800; line-height: 1.4;
  color: var(--text); margin-bottom: 14px;
}
.article-summary-lead {
  font-size: 16px; line-height: 1.7; color: var(--text-secondary);
  background: var(--quote-bg); padding: 14px 18px;
  border-left: 4px solid var(--accent);
  border-radius: 0 8px 8px 0;
}

.article-image-box {
  margin: 24px 0; border-radius: 10px; overflow: hidden;
  max-height: 520px; background: var(--border);
}
.article-image {
  width: 100%; display: block; object-fit: cover;
  cursor: zoom-in;
}

.detail-section {
  margin: 24px 0; padding: 20px 22px;
  background: var(--section-bg);
  border-radius: 10px; border: 1px solid var(--border);
}
.detail-title {
  font-size: 15px; font-weight: 700; color: var(--accent);
  margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
}
.detail-content {
  font-size: 15px; line-height: 1.8; color: var(--text);
  white-space: pre-line;
}

.points-list {
  list-style: none; display: flex; flex-direction: column; gap: 8px;
}
.points-list li {
  font-size: 14.5px; line-height: 1.6; color: var(--text);
  position: relative; padding-left: 20px;
}
.points-list li::before {
  content: "•"; position: absolute; left: 4px; top: -1px;
  color: var(--accent); font-size: 20px;
}

.quote-box {
  margin: 24px 0; padding: 16px 22px;
  border-left: 4px solid var(--gradient-end);
  background: var(--quote-bg);
  border-radius: 0 8px 8px 0;
  font-style: italic; font-size: 15px; line-height: 1.7;
}

.article-comment-box {
  margin: 24px 0; padding: 20px 22px;
  background: rgba(88,166,255,0.06);
  border-radius: 10px; border: 1px solid var(--border);
}
.comment-label {
  font-size: 14px; font-weight: 700; color: var(--accent);
  margin-bottom: 8px; display: flex; align-items: center; gap: 8px;
}
.article-comment {
  font-size: 15.5px; line-height: 1.8; color: var(--text);
}

.article-footer-bar {
  display: flex; align-items: center; justify-content: space-between;
  margin-top: 32px; padding-top: 20px;
  border-top: 1px solid var(--border);
  flex-wrap: wrap; gap: 14px;
}

.empty-state { text-align: center; padding: 80px 20px; color: var(--text-secondary); }

/* Lightbox Modal */
.lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.85); z-index: 999;
  justify-content: center; align-items: center;
  padding: 20px; cursor: zoom-out;
  backdrop-filter: blur(6px);
}
.lightbox.active { display: flex; }
.lightbox img {
  max-width: 95vw; max-height: 90vh;
  object-fit: contain; border-radius: 8px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.6);
}

.toast {
  position: fixed; bottom: 24px; right: 24px;
  background: var(--card-bg); border: 1px solid var(--accent);
  color: var(--text); padding: 10px 18px; border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
  font-size: 13px; opacity: 0; pointer-events: none;
  transform: translateY(10px); transition: all 0.25s;
  z-index: 1000;
}
.toast.show { opacity: 1; transform: translateY(0); }

@media (max-width: 680px) {
  .cards-grid { grid-template-columns: 1fr; }
  .article-card { padding: 20px 18px; }
  .article-title { font-size: 20px; }
  .dashboard { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="site-title" onclick="goHome()">📡 素材归档站</div>
    <div class="header-actions">
      <button class="theme-btn" id="themeToggle" onclick="toggleTheme()">🌓 切换主题</button>
    </div>
  </div>
</header>

<div class="container">
  <!-- LIST VIEW -->
  <div id="listView">
    <!-- Metrics Dashboard -->
    <div class="dashboard">
      <div class="metric-card">
        <div class="metric-label">收录条目</div>
        <div class="metric-value" id="metricTotal">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">分类领域</div>
        <div class="metric-value" id="metricTags">0</div>
      </div>
      <div class="metric-card">
        <div class="metric-label">最近更新</div>
        <div class="metric-value" id="metricRecent" style="font-size:15px; padding-top:4px;">-</div>
      </div>
    </div>

    <!-- Search & Tag Filter -->
    <div class="controls-card">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-box" id="searchBox"
               placeholder="搜索标题、背景、要点、深度分析或标签…" autocomplete="off">
      </div>
      <div class="tag-list" id="tagList"></div>
    </div>

    <!-- Cards Grid -->
    <div class="cards-grid" id="cardsGrid"></div>
  </div>

  <!-- DETAIL VIEW -->
  <div class="detail-view" id="detailView">
    <div class="back-bar">
      <button class="back-btn" onclick="goHome()">← 返回列表</button>
    </div>
    <article class="article-card" id="articleCard"></article>
  </div>
</div>

<!-- Lightbox Modal -->
<div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
  <img id="lightboxImg" src="" alt="放大图">
</div>

<div class="toast" id="toast">已复制</div>

<script>
const ENTRIES_URL = 'entries.json';
let allEntries = [];
let activeTag = null;

function initTheme() {
  const saved = localStorage.getItem('site_theme');
  if (saved) {
    document.documentElement.setAttribute('data-theme', saved);
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('site_theme', next);
}
initTheme();

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function showToast(text) {
  const t = document.getElementById('toast');
  t.textContent = text;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function copyArticle(title, url) {
  const text = `${title}\n${url || window.location.href}`;
  navigator.clipboard.writeText(text).then(() => {
    showToast('文章链接已复制');
  }).catch(() => {
    showToast('复制失败');
  });
}

function getStanceClass(stance) {
  if (!stance) return 'stance-default';
  if (stance.includes('赞同') || stance.includes('支持') || stance.includes('务实')) return 'stance-agree';
  if (stance.includes('反驳') || stance.includes('存疑') || stance.includes('批评')) return 'stance-oppose';
  if (stance.includes('观望') || stance.includes('观察') || stance.includes('中立')) return 'stance-watch';
  if (stance.includes('乐子') || stance.includes('吃瓜') || stance.includes('趣味')) return 'stance-fun';
  return 'stance-default';
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('active');
}

// Router
function route() {
  const hash = window.location.hash;
  const match = hash.match(/^#\/entry\/(.+)$/);
  if (match) {
    const entryId = match[1];
    showDetail(entryId);
  } else {
    showList();
  }
}
window.addEventListener('hashchange', route);

function goHome() {
  window.location.hash = '#/';
}

function openEntry(id) {
  window.location.hash = '#/entry/' + id;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showList() {
  document.getElementById('listView').style.display = 'block';
  document.getElementById('detailView').classList.remove('active');
  renderList(document.getElementById('searchBox').value);
}

function showDetail(id) {
  const entry = allEntries.find(e => String(e.id) === String(id));
  if (!entry) {
    goHome();
    return;
  }
  document.getElementById('listView').style.display = 'none';
  const detailView = document.getElementById('detailView');
  detailView.classList.add('active');
  renderDetail(entry);
}

function renderCardItem(e) {
  const stance = e.stance || '观察';
  const stanceClass = getStanceClass(stance);
  const tags = (e.tags || []).slice(0, 3);

  let html = `<div class="card-item" onclick="openEntry('${e.id}')">`;

  if (e.image) {
    html += `<div class="card-thumb-wrap">`;
    html += `<img class="card-thumb" src="${escapeHtml(e.image)}" alt="${escapeHtml(e.title)}" loading="lazy" onerror="this.parentElement.style.display='none'">`;
    html += `</div>`;
  }

  html += `<div class="card-body">`;
  html += `<div class="card-header-meta">`;
  html += `<span class="stance-badge ${stanceClass}">${escapeHtml(stance)}</span>`;
  html += `<span class="card-time">${formatTime(e.time)}</span>`;
  html += `</div>`;

  html += `<div class="card-title">${escapeHtml(e.title)}</div>`;
  html += `<div class="card-snippet">${escapeHtml(e.summary || e.comment || '')}</div>`;

  html += `<div class="card-footer">`;
  html += `<div class="card-tags">`;
  tags.forEach(t => {
    html += `<span class="card-tag">${escapeHtml(t)}</span>`;
  });
  html += `</div>`;
  html += `<span class="read-more-hint">阅读详情 →</span>`;
  html += `</div>`;

  html += `</div></div>`;
  return html;
}

function renderDetail(e) {
  const stance = e.stance || '观察';
  const stanceClass = getStanceClass(stance);
  const points = e.points || [];
  const tags = e.tags || [];

  let html = '';

  html += `<div class="article-header">`;
  html += `<div class="article-meta">`;
  html += `<span class="stance-badge ${stanceClass}" style="font-size:12px; padding:3px 10px;">${escapeHtml(stance)}</span>`;
  html += `<span style="font-size:13px; color:var(--text-secondary);">${formatTime(e.time)}</span>`;
  tags.forEach(t => {
    html += `<span class="card-tag" style="font-size:12px; padding:3px 10px;">${escapeHtml(t)}</span>`;
  });
  html += `</div>`;

  html += `<h1 class="article-title">${escapeHtml(e.title)}</h1>`;

  if (e.summary) {
    html += `<div class="article-summary-lead">${escapeHtml(e.summary)}</div>`;
  }
  html += `</div>`;

  // Cover image
  if (e.image) {
    html += `<div class="article-image-box">`;
    html += `<img class="article-image" src="${escapeHtml(e.image)}" alt="${escapeHtml(e.title)}" onclick="openLightbox(this.src)">`;
    html += `</div>`;
  }

  // Key points
  if (points.length > 0) {
    html += `<div class="detail-section">`;
    html += `<div class="detail-title">📌 核心事实要点</div>`;
    html += `<ul class="points-list">`;
    points.forEach(p => {
      html += `<li>${escapeHtml(p)}</li>`;
    });
    html += `</ul></div>`;
  }

  // Background context
  if (e.background) {
    html += `<div class="detail-section">`;
    html += `<div class="detail-title">🧭 事件背景与起因</div>`;
    html += `<div class="detail-content">${escapeHtml(e.background)}</div>`;
    html += `</div>`;
  }

  // Deep Analysis
  if (e.analysis) {
    html += `<div class="detail-section">`;
    html += `<div class="detail-title">🔍 深度剖析与机制拆解</div>`;
    html += `<div class="detail-content">${escapeHtml(e.analysis)}</div>`;
    html += `</div>`;
  }

  // Quote
  if (e.quote) {
    html += `<div class="quote-box">${escapeHtml(e.quote)}</div>`;
  }

  // Commentary
  if (e.comment) {
    html += `<div class="article-comment-box">`;
    html += `<div class="comment-label">💬 观察思考</div>`;
    html += `<div class="article-comment">${escapeHtml(e.comment).replace(/\n/g, '<br>')}</div>`;
    html += `</div>`;
  }

  // Footer Actions
  html += `<div class="article-footer-bar">`;
  html += `<div>`;
  if (e.source) {
    html += `<a class="entry-source" href="${escapeHtml(e.source)}" target="_blank" rel="noopener">🔗 阅读原文出处</a>`;
  }
  html += `</div>`;
  html += `<button class="back-btn" onclick="copyArticle('${escapeHtml(e.title)}')">📋 分享链接</button>`;
  html += `</div>`;

  document.getElementById('articleCard').innerHTML = html;
}

function selectTag(t) {
  if (activeTag === t) {
    activeTag = null;
  } else {
    activeTag = t;
  }
  renderTagList();
  renderList(document.getElementById('searchBox').value);
}

function resetFilters() {
  activeTag = null;
  document.getElementById('searchBox').value = '';
  renderTagList();
  renderList();
  goHome();
}

function renderTagList() {
  const tagCounts = {};
  allEntries.forEach(e => {
    (e.tags || []).forEach(t => {
      tagCounts[t] = (tagCounts[t] || 0) + 1;
    });
  });

  const list = document.getElementById('tagList');
  const tags = Object.keys(tagCounts);
  if (tags.length === 0) {
    list.innerHTML = '';
    return;
  }

  let html = `<span class="tag-pill ${activeTag === null ? 'active' : ''}" onclick="selectTag(null)">全部 (${allEntries.length})</span>`;
  tags.forEach(t => {
    const isAct = activeTag === t;
    html += `<span class="tag-pill ${isAct ? 'active' : ''}" onclick="selectTag('${escapeHtml(t)}')">${escapeHtml(t)} (${tagCounts[t]})</span>`;
  });
  list.innerHTML = html;
}

function updateMetrics() {
  document.getElementById('metricTotal').textContent = allEntries.length;
  const uniqueTags = new Set();
  allEntries.forEach(e => (e.tags || []).forEach(t => uniqueTags.add(t)));
  document.getElementById('metricTags').textContent = uniqueTags.size;

  if (allEntries.length > 0) {
    const sorted = [...allEntries].sort((a,b) => new Date(b.time) - new Date(a.time));
    document.getElementById('metricRecent').textContent = formatTime(sorted[0].time).slice(5);
  } else {
    document.getElementById('metricRecent').textContent = '-';
  }
}

async function loadEntries() {
  try {
    const r = await fetch(ENTRIES_URL + '?t=' + Date.now());
    allEntries = await r.json();
  } catch (e) {
    allEntries = [];
  }
  updateMetrics();
  renderTagList();
  route();
}

function renderList(query) {
  const grid = document.getElementById('cardsGrid');
  const q = (query || '').toLowerCase().trim();

  let filtered = allEntries;
  if (activeTag) {
    filtered = filtered.filter(e => (e.tags || []).includes(activeTag));
  }
  if (q) {
    filtered = filtered.filter(e => {
      const searchStr = (
        e.title + ' ' +
        (e.summary || '') + ' ' +
        (e.background || '') + ' ' +
        (e.analysis || '') + ' ' +
        (e.comment || '') + ' ' +
        (e.stance || '') + ' ' +
        (e.points || []).join(' ') + ' ' +
        (e.tags || []).join(' ')
      ).toLowerCase();
      return searchStr.includes(q);
    });
  }

  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><p>' +
      (q || activeTag ? '未找到符合条件的素材条目' : '归档站暂无素材') + '</p></div>';
    return;
  }

  const sorted = [...filtered].sort((a,b) => new Date(b.time) - new Date(a.time));
  grid.innerHTML = sorted.map(renderCardItem).join('');
}

document.getElementById('searchBox').addEventListener('input', function() {
  renderList(this.value);
});

loadEntries();
setInterval(loadEntries, 30000);
</script>
</body>
</html>
